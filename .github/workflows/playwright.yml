name: Playwright Tests
on:
  push:
    branches: [ main, master ]
    # 💡 FIX: Prevents workflow from triggering when report files change
    paths-ignore:
      - 'allure-report/**'
      - 'allure-results/**'
      - 'playwright-report/**'
      - 'test-results/**'
  pull_request:
    branches: [ main, master ]
    # 💡 FIX: Prevents workflow from triggering on PR updates to report files
    paths-ignore:
      - 'allure-report/**'
      - 'allure-results/**'
      - 'playwright-report/**'
      - 'test-results/**'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # 💡 FIX: Instantly drops the run if an automated bot pushed the commit
    if: ${{ github.actor != 'github-actions[bot]' }}
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Azure Login
      uses: azure/login@v3
      with:
        creds: ${{ secrets.Azure_Credentials }}
    - name: Run Playwright tests
      env:
        PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
      run: npx playwright test --config=playwright.service.config.js --workers=4
    - name: Generate Allure report
      run: npx allure generate --clean allure-results -o allure-report
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
